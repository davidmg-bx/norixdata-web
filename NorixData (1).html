<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NorixData</title>
<meta name="description" content="NorixData: dashboard y asistente de IA para clínicas.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add("js")</script>
<style>
:root{--bg:#12161B;--surface:#1B2128;--line:#2A323B;--text:#F4F5F2;--muted:#B3BAC2;--blue:#2F6BFF;--cyan:#1FB6E6;--mint:#5EE6A8;--grad:linear-gradient(135deg,#2F6BFF,#1FB6E6 55%,#5EE6A8);
--serif:"Instrument Serif",Georgia,serif;--sans:"Hanken Grotesk",system-ui,sans-serif;--violet:#8B7CFF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:calc(92px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 18px/1.65 var(--sans)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.15;margin:0 0 .5em;letter-spacing:-.015em}
h1{font-size:clamp(2.3rem,5vw,3.6rem)}
h2{font-size:clamp(1.7rem,3.4vw,2.4rem)}
h3{font-size:1.3rem}
h4{font-size:1.12rem;font-weight:600}
p{margin:0 0 1em;max-width:64ch}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
section{padding:92px 0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(18,22,27,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:22px;height:84px}
header img{height:54px;width:auto;margin-right:auto}
nav{display:flex;gap:26px}
nav a{text-decoration:none;color:var(--muted);font-size:1rem}
nav a:hover{color:var(--text)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);padding:7px 13px;font:500 .88rem var(--sans);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--surface);color:var(--text)}
.btn{display:inline-block;background:var(--grad);color:#08121c;font:600 1.02rem var(--sans);padding:14px 28px;border-radius:12px;text-decoration:none;border:0;cursor:pointer}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line)}
.btn.off{pointer-events:none;opacity:.55}
.btn:hover{filter:brightness(1.1)}
.hero{padding-top:76px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero p{color:var(--muted);font-size:1.18rem}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.chat{border-radius:24px;overflow:hidden;background:#E7EEF6;box-shadow:0 30px 80px rgba(31,182,230,.2);max-width:460px;margin-left:auto}
.chat-top{display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(120deg,#2F6BFF,#1FB6E6);color:#fff}
.chat-top img{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.chat-top b{display:block;font:600 1.05rem var(--sans)}
.chat-top span{font-size:.85rem;opacity:.92;display:flex;align-items:center;gap:6px}
.chat-top i{width:8px;height:8px;border-radius:50%;background:#5EE6A8}
.chat-body{padding:20px 16px 8px;display:flex;flex-direction:column;gap:10px;min-height:330px}
.m{padding:11px 15px;border-radius:18px;font-size:.98rem;line-height:1.45;max-width:88%;animation:pop .5s ease both}
.u{background:#2F6BFF;color:#fff;align-self:flex-end;border-bottom-right-radius:5px;animation-delay:.6s}
.b{background:#fff;color:#12161B;align-self:flex-start;border-bottom-left-radius:5px;animation-delay:2.5s;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.typing{background:#fff;align-self:flex-start;border-bottom-left-radius:5px;display:flex;gap:5px;overflow:hidden;animation:typ 1.2s 1.4s both}
.typing i{width:7px;height:7px;border-radius:50%;background:#8a97a6}
.mini{margin-top:10px;padding-top:10px;border-top:1px solid #dde4ec}
.mini small{display:block;font-size:.78rem;color:#52606f;margin-bottom:6px}
.mini div{display:flex;align-items:flex-end;gap:6px;height:56px}
.mini em{flex:1;background:var(--grad);border-radius:4px 4px 0 0;transform-origin:bottom;animation:grow .8s 2.9s cubic-bezier(.2,.8,.2,1) both}
.ill{font-size:.8rem;color:#52606f;text-align:center;padding:6px 0 12px}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
@keyframes typ{0%{opacity:0;max-height:0;padding:0 15px;margin-top:-10px}15%,85%{opacity:1;max-height:40px;padding:14px 15px;margin-top:0}100%{opacity:0;max-height:0;padding:0 15px;margin-top:-10px}}
.alt{background:#161B21;border-block:1px solid var(--line)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);margin-top:36px}
.cols>div{padding:0 28px;border-left:1px solid var(--line)}
.cols>div:first-child{padding-left:0;border:0}
.cols p{color:var(--muted);margin:0}
.steps{list-style:none;margin:36px 0 0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:56px 1fr;gap:18px;padding:22px 0;border-top:1px solid var(--line)}
.steps li::before{content:counter(s);font:500 2rem var(--serif);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.steps p{color:var(--muted);margin:0}
.detail{margin-top:56px;padding:40px;background:var(--surface);border:1px solid var(--line);border-radius:26px 26px 26px 6px}
.lead{font-size:1.2rem;color:var(--text);max-width:70ch}
.dcols{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin:28px 0}
.dcols p{color:var(--muted);margin:0}
.dfor{margin:0;padding-top:22px;border-top:1px solid var(--line);color:var(--mint);font:500 1.1rem var(--serif);max-width:none}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.split p{color:var(--muted)}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:40px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.person img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;display:block}
.pb{padding:24px 24px 14px}
.pb h3{margin-bottom:.3em}
.pb .tag{font:500 1.05rem var(--serif);color:var(--mint);margin:0 0 .9em}
.pb p{color:var(--muted);font-size:1rem;line-height:1.6;margin:0 0 .9em}
.soon{margin-top:28px;border:1px dashed var(--line);border-radius:16px;padding:22px;color:var(--muted);text-align:center;max-width:none}
.join{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;margin-top:36px;align-items:start}
.join>div{padding:34px;border-radius:22px;border:1px solid var(--line)}
.main{background:var(--surface)}
.join p{color:var(--muted)}
form{display:grid;gap:16px;margin-top:20px}
label{display:grid;gap:6px;font-size:.95rem;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:13px 14px;color:var(--text);font:inherit}
textarea{min-height:100px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.88rem}
.chk input{margin-top:5px;accent-color:var(--cyan)}
.mail{font:500 1.2rem var(--serif);color:var(--cyan)}
#ok{color:var(--mint);margin:0}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:.92rem}
@media(max-width:860px){nav{display:none}header img{height:42px}header .wrap{height:72px}.hero .wrap,.split,.team,.join{grid-template-columns:1fr}.cols,.dcols{grid-template-columns:1fr;gap:24px}.cols>div{padding:0;border:0}.person{max-width:440px;margin:0 auto}section{padding:64px 0}.detail,.join>div{padding:26px}.chat{margin:0 auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto}.typing{display:none}}

h1,h2,h3{font-weight:400}
h1{font-size:clamp(2.9rem,6.6vw,5.2rem);line-height:1.02}
h2{font-size:clamp(2.1rem,4.2vw,3.3rem);line-height:1.08}
h3{font-size:1.7rem;line-height:1.1}
h4{font-family:var(--sans);font-weight:600;font-size:1.05rem;letter-spacing:0}
.pb h3{font-size:1.8rem}.pb .tag{font-size:1.25rem;font-style:italic}
.dfor{font-size:1.4rem;font-weight:400}.steps li::before{font-size:2.6rem;font-weight:400}.mail{font-size:1.5rem}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .12em}
.w span{display:inline-block;animation:up 1s cubic-bezier(.2,.8,.2,1) both}
.w .em{font-style:italic;background:linear-gradient(100deg,#1FB6E6,#5EE6A8);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
@keyframes up{from{transform:translateY(115%)}}
.hero{position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(30px);pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
.hero::before{width:640px;height:640px;left:-200px;top:-180px;background:radial-gradient(closest-side,rgba(47,107,255,.38),transparent)}
.hero::after{width:560px;height:560px;right:-140px;bottom:-200px;background:radial-gradient(closest-side,rgba(94,230,168,.26),transparent);animation-delay:-6s}
.hero .wrap{position:relative;z-index:1}
@keyframes drift{to{transform:translate(70px,50px) scale(1.15)}}
.chat{animation:float 7s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-10px)}}
.btn{background:linear-gradient(110deg,#2F6BFF,#1FB6E6,#5EE6A8,#1FB6E6,#2F6BFF);background-size:300% 100%;transition:transform .25s,box-shadow .25s,background-position .8s}
.btn.ghost{background:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(31,182,230,.35);background-position:100% 0;filter:none}
.btn.ghost:hover{background:rgba(255,255,255,.05);box-shadow:none}
.ticker{overflow:hidden;border-block:1px solid var(--line);padding:20px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.tk{display:flex;width:max-content;animation:tick 36s linear infinite}
.tk span{font:italic 400 2rem var(--serif);color:var(--muted);padding:0 32px;position:relative;white-space:nowrap}
.tk span::after{content:"";position:absolute;right:-4px;top:50%;width:7px;height:7px;border-radius:50%;background:var(--grad);transform:translateY(-50%)}
@keyframes tick{to{transform:translateX(-25%)}}
.js .rv{opacity:0;transform:translateY(28px);transition:opacity .9s cubic-bezier(.2,.8,.2,1) var(--d,0s),transform .9s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.js .rv.in{opacity:1;transform:none}
.person img{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.person:hover img{transform:scale(1.05)}
.person:hover{border-color:rgba(31,182,230,.55);box-shadow:0 20px 50px rgba(31,182,230,.14)}
.sec{position:relative;overflow:hidden;background:radial-gradient(900px 480px at 88% 18%,rgba(139,124,255,.24),transparent 60%),linear-gradient(180deg,#0A0E22,#0D1130 60%,#0A0E22);border-block:1px solid #232A55}
.secgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.tags span{border:1px solid rgba(139,124,255,.55);color:#CFC9FF;border-radius:999px;padding:5px 15px;font-size:.85rem;background:rgba(139,124,255,.12)}
.sec h2{color:#fff}.sec p{color:#B9BFE0}
.pledge{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pledge li{padding:18px 20px;border:1px solid #2A3166;border-radius:16px;background:rgba(20,26,66,.55)}
.pledge li:hover{border-color:var(--violet);background:rgba(40,44,110,.55)}
.pledge h4{color:#fff;margin-bottom:.35em}.pledge p{margin:0;font-size:.95rem;color:#AAB1D8}
.secN{font-size:.92rem;margin-top:24px;color:#8E96C4}
.mol svg{width:100%;height:auto;max-width:440px;margin:0 auto;display:block}
.mol .spin{transform-origin:200px 200px;animation:rot 90s linear infinite}
.mol .ring{fill:none;stroke:#3A4390;stroke-dasharray:3 9}
.mol .hex{fill:rgba(139,124,255,.09);stroke:url(#gm);stroke-width:2.5}
.mol .bond{stroke:#6A74C8;stroke-width:1.6;stroke-dasharray:5 7;animation:flow 2.4s linear infinite}
.mol .out{stroke:#4A53A6;stroke-width:1.4}
.mol .nd{fill:url(#gm);transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
.mol .sh{fill:url(#gm);transform-origin:200px 200px;animation:glow 4s ease-in-out infinite}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes pulse{50%{transform:scale(1.4);opacity:.7}}@keyframes glow{50%{transform:scale(1.08)}}
.vision{padding:120px 0;text-align:center}
.vision .kicker{color:var(--cyan);font-size:.95rem;margin:0 auto 18px;max-width:none}
.vision .big{font:italic 400 clamp(1.9rem,4.2vw,3.2rem)/1.18 var(--serif);max-width:26ch;margin:0 auto;color:var(--text)}
@media(max-width:860px){.secgrid{grid-template-columns:1fr}.pledge{grid-template-columns:1fr}.mol svg{max-width:300px}.tk span{font-size:1.5rem}.vision{padding:80px 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.js .rv{opacity:1;transform:none}}
</style>
</head>

function splitH1(){const h=document.getElementById("h1");const t=h.textContent;let n=0;h.setAttribute("aria-label",t.replace(/\*/g,""));
h.innerHTML=t.split("*").map((p,k)=>p.split(" ").filter(Boolean).map(w=>`<span class="w" aria-hidden="true"><span class="${k%2?"em":""}" style="animation-delay:${.15+(n++)*.1}s">${w}</span></span>`).join(" ")).join(" ")}
function setLang(l){
document.documentElement.lang=l;
document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=T[l][e.dataset.i18n]);
document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
document.title="NorixData · "+T[l].h1.replace(/\*/g,"");splitH1();document.getElementById("tk").innerHTML=T[l].tk.map(w=>`<span>${w}</span>`).join("").repeat(4);
try{localStorage.setItem("lang",l)}catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let init=(navigator.language||"es").startsWith("en")?"en":"es";
try{init=localStorage.getItem("lang")||init}catch(e){}
setLang(init);
const io=("IntersectionObserver" in window&&!matchMedia("(prefers-reduced-motion: reduce)").matches)?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.15}):null;
document.querySelectorAll("h2,.cols>div,.steps li,.detail,.person,.join>div,.soon,.pledge li,.vision p,.mol,.tags,.secN").forEach(e=>{e.classList.add("rv");e.style.setProperty("--d",([...e.parentNode.children].indexOf(e)%4)*.1+"s");io?io.observe(e):e.classList.add("in")});
